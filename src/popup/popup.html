<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Jira Task Plus</title>
  <link href="../assets/styles.css" rel="stylesheet" />
  <style>
    body { width: 220px; }
  </style>
</head>
<body class="bg-base-100 p-2">

  <div class="flex items-center gap-2 px-2 py-2 mb-1 border-b border-base-200">
    <span class="text-base">➕</span>
    <span class="font-bold text-sm text-primary">Jira Task Plus</span>
  </div>

  <ul class="menu menu-sm p-1 gap-1">
    <li>
      <button id="btn-options" class="flex items-center gap-2 text-sm">
        <span>⚙️</span> Options
      </button>
    </li>
    <li>
      <button id="btn-focus" class="flex items-center gap-2 text-sm">
        <span id="focus-icon">🎯</span>
        <span id="focus-label">Focus Mode</span>
      </button>
    </li>
  </ul>

  <script src="popup.js"></script>

</html>
